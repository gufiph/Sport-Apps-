<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
input[type=number]{-moz-appearance:textfield;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.hdr{background:#0f172a;border-bottom:1px solid #1e293b;padding:9px 14px;position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:14px;font-weight:800;}
.main{padding:10px 14px 76px;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;display:flex;padding:5px 0 16px;z-index:50;}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:#475569;font-size:17px;}
.tab.active{color:#6366f1;}
.tab span{font-size:8px;font-weight:400;}
.tab.active span{font-weight:700;}
.card{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:8px;}
.date-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.nav-btn{background:#1e293b;border:none;color:#e2e8f0;border-radius:8px;padding:6px 12px;font-size:18px;cursor:pointer;}
.score-card{border-radius:12px;padding:12px;margin-bottom:10px;text-align:center;}
.rings{display:flex;justify-content:space-around;margin-bottom:10px;}
.ring-wrap{display:flex;flex-direction:column;align-items:center;}
.ring-val{margin-top:-35px;margin-bottom:22px;text-align:center;font-size:11px;font-weight:700;}
.ring-lbl{font-size:9px;color:#64748b;margin-top:1px;}
.section-hdr{font-size:10px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.num-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#1e293b;border-radius:8px;margin-bottom:4px;font-size:12px;color:#cbd5e1;}
.num-ctrl{display:flex;align-items:center;gap:4px;}
.num-ctrl button{width:26px;height:26px;border-radius:6px;background:#334155;border:none;color:#e2e8f0;font-size:15px;cursor:pointer;}
.unit{font-size:10px;color:#475569;width:18px;}
.toggle-btn{flex:1;padding:9px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:11px;background:#1e293b;color:#64748b;}
.toggle-btn.on{background:#065f46;color:#6ee7b7;}
.meal-mini{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0f172a;border-radius:8px;margin-bottom:3px;cursor:pointer;}
.meal-card{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;}
.meal-em{font-size:28px;width:44px;height:44px;background:#0f172a;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.macros-sm{display:flex;gap:6px;margin-top:2px;font-size:9px;}
.totals-bar{background:#0f172a;border-radius:10px;padding:10px;display:flex;justify-content:space-around;margin-top:4px;}
.tot-val{font-size:15px;font-weight:800;text-align:center;}
.tot-lbl{font-size:8px;color:#64748b;text-align:center;}
.day-tab{flex:1;padding:8px 0;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:12px;background:#1e293b;color:#475569;border-bottom:2px solid transparent;}
.day-tab.active{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border-bottom-color:var(--c);}
.ex-card{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:7px;}
.set-btn{width:32px;height:32px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:#0f172a;color:#475569;}
.set-btn.done{background:#065f46;color:#6ee7b7;}
.essen-tab{flex:1;padding:7px 0;border-radius:7px;border:none;cursor:pointer;font-size:10px;font-weight:600;background:#1e293b;color:#475569;}
.essen-tab.active{background:#6366f122;color:#6366f1;}
.shop-tab{flex:1;padding:8px 0;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:#1e293b;color:#475569;}
.shop-tab.active{background:#6366f122;color:#6366f1;}
.shop-item{display:flex;justify-content:space-between;padding:5px 10px;background:#1e293b;border-radius:7px;margin-bottom:2px;font-size:12px;}
.week-slot{flex:1;background:#0f172a;border-radius:7px;padding:6px;text-align:center;cursor:pointer;}
.btn-fill{flex:1;padding:9px 0;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:#065f46;color:#6ee7b7;}
.btn-clear{flex:1;padding:9px 0;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:#1e293b;color:#f43f5e;}
.btn-primary{width:100%;padding:14px;background:#6366f1;border:none;border-radius:10px;color:white;font-size:16px;font-weight:700;cursor:pointer;}
.btn-reset{width:100%;padding:7px;background:none;border:1px solid #334155;border-radius:7px;color:#475569;font-size:10px;cursor:pointer;}
.recipe-card{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:5px;}
.picker-hdr{padding:12px 14px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f172a;z-index:50;}
.pick-card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;}
.pick-card.sel{background:#1e3a5f;border-color:#3b82f6;}
.stat-card{background:#1e293b;border-radius:10px;padding:10px;text-align:center;}
.recipe-link{display:inline-block;font-size:9px;color:#818cf8;text-decoration:none;margin-left:6px;opacity:0.7;}
.recipe-link:hover{opacity:1;}
.yazio-box{display:flex;gap:1px;margin-top:4px;background:#0f172a;border-radius:6px;overflow:hidden;font-size:10px;}
.yazio-box div{flex:1;padding:4px 2px;text-align:center;}
.yazio-box .yz-label{font-size:7px;color:#64748b;display:block;}
.btn-print{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:#1e293b;color:#818cf8;}
@media print{
  body{background:#fff!important;color:#000!important;font-size:12px!important;}
  .hdr,.tabs,.nav-btn,.btn-print,.btn-fill,.btn-clear,.toggle-btn,.num-row,.num-ctrl,.score-card,.rings,.essen-tab,.shop-tab,.date-nav,.section-hdr{display:none!important;}
  .main{padding:0!important;}
  .card,.meal-card,.recipe-card,.pick-card,.ex-card{background:#f5f5f5!important;border:1px solid #ddd!important;color:#000!important;break-inside:avoid;margin-bottom:8px!important;}
  .meal-em{background:#eee!important;}
  .macros-sm span,.tot-val,.ring-val{color:#000!important;}
  #printArea{display:block!important;}
  #app{display:none!important;}
  @page{margin:10mm;}
}
#printArea{display:none;}
</style>
</head>

<script>

const GK_REZEPTE = [
  {n:"Diät Sushi",em:"🍣",kcal:454,p:27,kh:51,f:13,port:"2 Portionen",
   zut:"2 Gurken · 80g Reis · 2 Zehen Knoblauch · 200g Lachs · ½ Zitrone · 2 Lauchzwiebeln · 2 EL Chilisauce · 1 EL Sojasauce · 1 EL Miracle Whip light · Sesam · Salz, Pfeffer",
   zub:"1. Lachs mit Zitronensaft, Öl, Knoblauch, Salz und Pfeffer marinieren, 20 Min bei 180°C Umluft backen. 2. Reis kochen. 3. Gurken längs halbieren, Kerne rauskratzen. 4. Lauchzwiebel in Ringe schneiden. 5. Chilisauce, Sojasauce und Miracle Whip verrühren. 6. Reis in Gurkenhälften füllen, Lachs zerdrücken und verteilen. 7. Mit Frühlingszwiebeln, Soße und Sesam toppen."},
  {n:"Diät Big King",em:"🍔",kcal:835,p:59,kh:41,f:51,port:"1 Portion",
   zut:"200g Rinderhackfleisch · 250g Kartoffeln · 50g Eisbergsalat · ¼ Zwiebel · 1 TL Senf · 1 EL Ketchup light · 3 EL Miracle Whip light · 4 EL Gurkenwasser · 50g Cheddar · Salz, Pfeffer, Paprikapulver, Knoblauchpulver",
   zub:"1. Hackfleisch würzen, 3 Patties formen und plattdrücken. 2. Kartoffeln in Scheiben mit Öl und Salz bei 180°C/25 Min im Airfryer oder 200°C Umluft backen. 3. Zwiebel und Salat schneiden. 4. Soße aus Gurkenwasser, Ketchup, Senf, Miracle Whip und Gewürzen rühren. 5. Patties braten, Käse schmelzen. 6. Burger schichten: Kartoffel – Salat – Patty – Zwiebeln – Soße."},
  {n:"Airfryer Bowl",em:"🥘",kcal:754,p:76,kh:70,f:13,port:"1 Portion",
   zut:"300g Kartoffeln · 1 rote Zwiebel · 2 rote Spitzpaprika · 2 Peperoni · 200g Hähnchenbrust · 1 Knoblauchzehe · 1 TL Olivenöl · 50g Hirtenkäse light · 200g Joghurt 0,1 % · Petersilie · Salz, Pfeffer, Oregano, Paprikapulver",
   zub:"1. Kartoffeln, Zwiebel, Paprika, Peperoni und Knoblauch klein schneiden. 2. Hähnchen in Scheiben schneiden. 3. Alles mit Olivenöl und Gewürzen marinieren, Hirtenkäse drüberbröseln. 4. Im Airfryer 25 Min bei 180°C frittieren (alle 10 Min rühren). 5. Joghurt mit Salz und Knoblauchpulver würzen, dazu servieren."},
  {n:"Sattmacher Bowl",em:"🥗",kcal:814,p:44,kh:94,f:26,port:"1 Portion",
   zut:"100g Reis (ungekocht) · 1 Tomate · 30g Römersalat · 100g Hähnchenbrust · 30g Mais · 1 Ei · 100g griechischer Joghurt · 1 EL Mayonnaise · 1 Knoblauchzehe · Chiliflocken · 1 EL Chilisauce · Salz & Pfeffer",
   zub:"1. Reis in Salzwasser kochen. 2. Ei kochen. 3. Tomate und Salat schneiden. 4. Hähnchen würfeln, würzen und anbraten. 5. Dressing aus Joghurt, Mayo, Knoblauch, Zitronensaft, Chiliflocken und Chilisauce rühren. 6. Bowl anrichten, Dressing drüber."},
  {n:"Cheeseburger Kartoffeln",em:"🥔",kcal:744,p:66,kh:52,f:28,port:"1 Portion",
   zut:"300g Kartoffeln · 1 TL Olivenöl · 30g Ketchup Zero · 20g Senf · ½ Zwiebel · 10g Gewürzgurken · 150g Rinderhack fettreduziert · 100g Reibekäse light · Salz, Pfeffer, Paprikapulver",
   zub:"1. Kartoffeln in dünne Scheiben schneiden, mit Öl, Salz und Paprikapulver mengen. 2. Auf Backblech verteilen, mit Ketchup und Senf bestreichen. 3. Zwiebeln und Gewürzgurken drauf, dann Hackfleisch und Käse. 4. 20 Min bei 200°C Umluft backen."},
  {n:"Chili-Cheese-Burger Kartoffeln",em:"🌶️",kcal:727,p:65,kh:52,f:28,port:"1 Portion",
   zut:"300g Kartoffeln · 100g Schmelzkäse light · 2 EL Jalapeño-Wasser · 30g Cheddar · 150g Rinderhack fettreduziert · 30g magere Schinkenwürfel · 10g Jalapeños · Salz, Paprikapulver · 1 TL Olivenöl",
   zub:"1. Schmelzkäse, Cheddar und Jalapeño-Wasser im Topf erhitzen. 2. Kartoffeln in dünne Scheiben schneiden, mit Öl, Salz und Paprikapulver würzen. 3. Auf Backblech verteilen, Soße, Hackfleisch, Schinkenwürfel, Jalapeños und Käse drauf. 4. 20-25 Min bei 200°C Umluft backen."},
  {n:"Arabische Sattmacher Bowl",em:"🧆",kcal:555,p:23,kh:78,f:14,port:"1 Portion",
   zut:"100g Bulgur (ungekocht) · 10g Romana Salat · 10g Granatapfelkerne · 30g rote Paprika · 10g Frühlingszwiebeln · 30g Hirtenkäse · 5g Petersilie · 3 Falafel · 2 EL griechischer Joghurt · 1 Knoblauchzehe · Zitronensaft · Olivenöl · 5g Minze · Süßstoff · Salz",
   zub:"1. Bulgur nach Packungsanweisung kochen. 2. Granatapfel entkernen, Salat, Paprika und Petersilie schneiden. 3. Alles in eine Schüssel mit dem Bulgur. 4. Hirtenkäse drüberbröseln. 5. Dressing aus Joghurt, Knoblauch, Zitronensaft, Olivenöl, Minze und Süßstoff anrühren. 6. Mit Falafeln servieren."},
  {n:"Caesar Diät Wrap",em:"🌯",kcal:430,p:52,kh:29,f:11,port:"2 Wraps",
   zut:"1 Brötchen · 300g Hähnchen · 150g Joghurt · 50g Miracel Whip light · ½ TL Senf · Zitronensaft · 1 Knoblauchzehe · 2 EL Worcestershire Sauce · 50g Parmesan · 8 Eisbergsalatblätter · 150g Cocktailtomaten · Pfeffer, Salz",
   zub:"1. Brötchen würfeln, mit Öl und Knoblauchgewürz in der Pfanne rösten. 2. Hähnchen würfeln und in Pfanne anbraten. 3. Dressing aus Joghurt, Miracle Whip, Senf, Zitronensaft, Knoblauch, Worcestershire und Parmesan rühren. 4. Salatblätter ausbreiten, Dressing, Tomaten, Hähnchen und Croutons drauf, einrollen."},
  {n:"Oreo Cheesecake",em:"🎂",kcal:990,p:118,kh:63,f:26,port:"1 Kuchen (Gesamtkalorien)",
   zut:"2 Eier · 200g Frischkäse light · 200g griechischer Joghurt light · 500g Magerquark · 1 Pack Puddingpulver Vanille · 15g Designer Flavor Powder · 2 Oreos · 15g Schokoglasur",
   zub:"1. Alle Zutaten außer Oreos und Glasur mixen. 2. Oreos zerbröseln und unterheben. 3. In gefettete Backform, 30-40 Min bei 170°C Umluft backen. 4. 1 Stunde abkühlen lassen. 5. Mit Schokoglasur verfeinern."},
  {n:"650 kcal Abnehm Bowl",em:"🌮",kcal:650,p:35,kh:60,f:25,port:"1 Bowl",
   zut:"300g Kartoffeln · 1 rote Zwiebel · ½ Avocado · 1 Knoblauchzehe · 100g Tomaten · 125g Rinderhack fettreduziert · Cheddar · Joghurt · Petersilie · Salz, Pfeffer, Paprikapulver · Zitronensaft",
   zub:"1. Kartoffeln würfeln, mit Öl, Salz und Paprikapulver 20 Min bei 200°C backen. 2. Guacamole aus Avocado, Zwiebel, Knoblauch, Zitronensaft zubereiten. 3. Tomaten und Petersilie schneiden. 4. Hackfleisch braten, mit Käse überbacken. 5. Bowl mit allen Komponenten und Joghurt anrichten."},
  {n:"Big Tasty Bacon Bowl",em:"🥩",kcal:489,p:39,kh:52,f:13,port:"1 Bowl",
   zut:"300g Kartoffeln · 1 TL Olivenöl · 1 rote Zwiebel · 250ml Sauce Hollandaise light · 1 TL Sambal Oelek · 1 TL Tomatenmark · 150g Rinderhack fettreduziert · 15g Eisbergsalat · Salz, Pfeffer, Paprikapulver",
   zub:"1. Kartoffeln würfeln, mit Öl und Salz 20 Min bei 200°C backen. 2. Zwiebel würfeln. 3. Hollandaise mit Tomatenmark und Sambal Oelek erhitzen. 4. Hackfleisch mit Gewürzen und halber Zwiebel braten. 5. Salat, Kartoffeln, Hackfleisch, Zwiebeln und Soße anrichten."},
  {n:"Tex Mex Sattmacher Platte",em:"🌯",kcal:457,p:32,kh:18,f:23,port:"1 Portion",
   zut:"15g Eisbergsalat · 70g gelbe Paprika · 70g Tomaten · 40g Mais-Kidneybohnen-Mix · 100g Rinderhack fettreduziert · 20g rote Zwiebel · 20g Cheddar · 8g Nachos · 40g Avocado · 30g Creme leicht · Petersilie · 1 Limette · 1 Knoblauchzehe · Salz, Pfeffer, Paprikapulver",
   zub:"1. Paprika, Zwiebeln, Salat, Tomaten und Avocado schneiden. 2. Hackfleisch würzen und braten. 3. Creme leicht mit Limettensaft, Knoblauch, Salz und Petersilie verrühren. 4. Salat in Schüssel, alles schichten, Dressing drüber."},
  {n:"1500 kcal Frühstück",em:"🥣",kcal:432,p:49,kh:42,f:6,port:"1 Portion",
   zut:"100g Erdbeeren · 200g Magerquark · 30g Haferflocken · 200g Protein-Vanille-Pudding · Mineralwasser · 1 Messlöffel Designer Flavor Powder · 1 Reiswaffel",
   zub:"1. Proteinpudding mit Haferflocken und einem Schuss Mineralwasser mengen. 2. Erdbeeren in Scheiben schneiden. 3. Magerquark mit Flavor Powder und Mineralwasser verrühren. 4. Im Einmachglas schichten: Quark – Erdbeeren – Pudding-Oats – Erdbeeren – zerbröselte Reiswaffel."},
  {n:"Griechische Genießerplatte",em:"🥗",kcal:525,p:51,kh:52,f:11,port:"1 Portion",
   zut:"300g Kartoffeln · 1 TL Olivenöl · ½ Zitrone · 1 Knoblauchzehe · 2 EL Joghurt · 15g Eisbergsalat · 70g gelbe Paprika · 70g Tomaten · 10g rote Zwiebel · 150g Hähnchenbrust · 30g Hirtenkäse light · Salz, Oregano, Dill",
   zub:"1. Kartoffeln würfeln, mit Öl, Salz und Oregano 20 Min bei 200°C backen. 2. Dressing aus Joghurt, Zitronensaft, Knoblauch, Oregano und Dill. 3. Gemüse schneiden. 4. Hähnchen würfeln und anbraten. 5. Alles anrichten."},
  {n:"Hirtenkäse-Dip mit Ofengemüse",em:"🥦",kcal:629,p:48,kh:59,f:18,port:"1 Portion",
   zut:"300g Kartoffeln · 300g Brokkoli · 1 TL Olivenöl · 150g körniger Frischkäse · 60g Hirtenkäse light · 1 EL Tomatenmark · 1 Knoblauchzehe · Frische Petersilie · Salz, Pfeffer, Oregano",
   zub:"1. Kartoffeln und Brokkoli schneiden, mit Öl und Gewürzen marinieren, 20 Min bei 180°C backen. 2. Für Dip: Frischkäse, Hirtenkäse, Tomatenmark, Knoblauch, Salz, Pfeffer und Olivenöl pürieren. 3. Petersilie hacken, unterheben. 4. Gemüse mit Dip anrichten."},
  {n:"Caesar Crispy Chicken",em:"🍗",kcal:629,p:48,kh:59,f:18,port:"1 Portion",
   zut:"150g Hähnchenbrust · 10g Mehl · 1 Ei · 20g Cornflakes · 40g Romana Salat · 1 Tomate · Salz, Pfeffer · Dressing (2 Port.): 150g Joghurt · 1 Zitrone · 1 Knoblauchzehe · 1 EL Mayo light · 1 TL Senf · 30g Parmesan · 2 EL Worcester Sauce",
   zub:"1. Hähnchen plattdrücken, salzen. 2. Panierstraße: Mehl – Ei (gesalzen) – Cornflakes. 3. Hähnchen panieren, 20 Min bei 180°C Umluft backen. 4. Salat und Tomaten schneiden. 5. Dressing pürieren. 6. Hähnchen, Salat, Tomaten, Parmesan und Dressing anrichten."},
  {n:"Zu Faul zum Kartoffelschälen",em:"🥔",kcal:477,p:22,kh:72,f:9,port:"1 Portion",
   zut:"400g Kartoffeln · ½ Gurke · 100g Joghurt · 1 EL Miracel Whip · 10g rote Zwiebel · 1 Knoblauchzehe · 1 TL Senf · 1 Ei · Petersilie · Dill · Salz, Paprikapulver",
   zub:"1. Kartoffeln in Pommes-Form schneiden, mit Salz, Paprikapulver und Öl schwenken, 20 Min bei 200°C backen. 2. Gurke und Zwiebel schneiden. 3. Joghurt-Dip mit Mayo, Senf, Dill, Petersilie, Zwiebel und Knoblauch. 4. Gurken und Pommes in den Dip geben. 5. Dazu gekochte Eier."},
  {n:"Pfannenpizza",em:"🍕",kcal:366,p:22,kh:30,f:17,port:"2 Portionen",
   zut:"1 Zwiebel · 1 Knoblauchzehe · 1 rote Paprika · 1 gelbe Paprika · 200g Zucchini · 120g Cocktailtomaten · 500g passierte Tomaten · 100g Gouda · 25g Geflügelsalami · 5g Basilikum · Salz, Pfeffer, Thymian, Oregano",
   zub:"1. Gemüse in mundgerechte Stücke schneiden. 2. Zwiebeln in Öl andünsten, restliches Gemüse und Knoblauch dazu, würzen. 3. Mit passierten Tomaten und Basilikum ablöschen, kurz köcheln. 4. Käse drüber, Salami drauf, Deckel drauf bis Käse schmilzt."},
  {n:"Spargel mit Hähnchen & Pesto-Soße",em:"🌿",kcal:838,p:51,kh:90,f:28,port:"3 Portionen",
   zut:"450g grüner Spargel · 3 EL Olivenöl · 30g Parmesan · 300g Reis (ungekocht) · 450g Hähnchenbrust · 45g Pesto Rosso · 225ml Kochsahne light · 3 EL Tomatenmark · 1 Knoblauchzehe · Salz, Basilikum, Oregano",
   zub:"1. Spargel auf Backblech mit Öl und Parmesan, 15-20 Min bei 180°C. 2. Reis kochen. 3. Hähnchen in Stücke schneiden, anbraten. 4. Tomatenmark, Knoblauch, Pesto Rosso und Kochsahne zur Soße aufkochen, Hähnchen darin fertig garen. 5. Alles anrichten."},
  {n:"Burger Alfredo",em:"🍔",kcal:375,p:29,kh:35,f:13,port:"3 Burger",
   zut:"210g Hähnchenbrust · 3 Burger Buns · 60g Champignons · 90ml Kochsahne light · 30g Blattspinat · 30g magere Schinkenwürfel · 30g Parmesan · 1 Knoblauchzehe · Salz, Pfeffer, Knoblauchpulver, Paprikapulver",
   zub:"1. Hähnchen dünn aufschneiden, würzen und 2 Min pro Seite anbraten. 2. Champignons in Scheiben schneiden. 3. Knoblauch, Schinkenwürfel und Champignons anbraten, würzen. 4. Mit Kochsahne und Parmesan ablöschen, köcheln. 5. Buns mit Ei einpinseln, mit Parmesan, 5 Min bei 180°C im Ofen. 6. Mit Spinat, Hähnchen und Soße belegen."},
  {n:"Ofen Genießerplatte",em:"🍅",kcal:449,p:33,kh:54,f:9,port:"2 Portionen",
   zut:"600g Kartoffeln · 250g Cocktailtomaten · 1 TL Olivenöl · 1 EL Ajvar · 250g Magerquark · 100g Hirtenkäse light · Petersilie · Salz, Pfeffer, Rosmarin, Oregano, Knoblauchpulver",
   zub:"1. Kartoffeln in Stücke schneiden, mit Öl und Gewürzen 20 Min bei 200°C backen. 2. Tomaten ebenfalls im Ofen garen. 3. Ajvar, Quark, Hirtenkäse, Oregano, Salz und Pfeffer pürieren. 4. Quarkcreme auf Teller, Kartoffeln und Tomaten drauf, Petersilie und restlichen Käse."},
  {n:"In Form Kochen",em:"🥚",kcal:502,p:32,kh:49,f:19,port:"1 Portion",
   zut:"300g Kartoffeln · 100g grüner Spargel · 20g Parmesan · 2 Eier · 30g Kräuterquark · 5ml Olivenöl · Salz, Pfeffer",
   zub:"1. Kartoffeln würfeln, Spargelenden abschneiden, auf Backblech, mit Öl und Salz und Parmesan. 2. 20 Min bei 200°C Umluft. 3. Eier in Pfanne braten, würzen. 4. Kartoffeln, Spargel, Eier und Kräuterquark anrichten."},
  {n:"Curry Fryerabend",em:"🍛",kcal:692,p:42,kh:110,f:7,port:"1 Portion (als Solo)",
   zut:"2 rote Spitzpaprika · 100g grüne Bratpaprika · 1 rote Zwiebel · 1 Fleischtomate · 50g Hirtenkäse light · 200g Hähnchenbrust · 3 TL Tandoori-Paste · 250g Reis (ungekocht) · Petersilie · 1 EL Joghurt · Salz, Currypulver",
   zub:"1. Gemüse in Stücke schneiden, Hähnchen würfeln. 2. Alles in den Airfryer, mit Tandoori und Salz würzen, Hirtenkäse drüber. 3. 20 Min bei 180°C. 4. Reis in Salzwasser kochen, mit Curry würzen. 5. Alles anrichten, mit Joghurt und Petersilie."},
  {n:"Sushi Bowl",em:"🍣",kcal:863,p:53,kh:79,f:29,port:"1 Bowl",
   zut:"200g gekochter Reis · 200g Lachs · 30g BBQ-Sauce light · 1 Frühlingszwiebel · 100g Gurke · 50g Avocado · 10g Mayo light · 20g Sweet-Chili-Sauce · Sesam · Salz, Knoblauchpulver",
   zub:"1. Lachs würfeln, mit Salz, Knoblauchpulver und BBQ-Sauce marinieren. 2. Reis in Auflaufform füllen, Lachs drauf. 3. 20 Min bei 180°C Umluft backen. 4. Avocado, Gurke und Lauchzwiebel schneiden. 5. Auflauf mit Gemüse, Mayo light, Sweet-Chili und Sesam toppen."},
  {n:"Nudelsalat Bacon",em:"🥗",kcal:858,p:57,kh:107,f:16,port:"2 Portionen",
   zut:"250g Nudeln (ungekocht) · 150g Cocktailtomaten · 40g Eisbergsalat · 100g Mais · ½ Avocado · 1 gelbe Paprika · 1 EL Mayo light · 1 EL Chilisauce · 300g Hähnchenbrust · 4 Streifen Bacon · Petersilie · Salz, Pfeffer, Cayennepfeffer, Paprikapulver",
   zub:"1. Nudeln kochen, abkühlen. 2. Tomaten, Salat, Paprika und Avocado schneiden, mit Mais und Nudeln mischen. 3. Dressing aus Mayo und Chilisauce. 4. Hähnchen würzen und braten. 5. Bacon knusprig braten. 6. Nudeln mit Hähnchen, Bacon und Soße anrichten."},
  {n:"Süßkartoffel Burger Bowl",em:"🍠",kcal:819,p:49,kh:79,f:33,port:"1 Portion",
   zut:"100g Eisbergsalat · 350g Süßkartoffeln · 150g Rinderhack fettreduziert · 30g Cheddar · 150g Cherrytomaten · 30g rote Zwiebel · 40g Avocado · 5g Lauchzwiebeln · 15g Creme leicht · 1 TL Olivenöl · Salz, Cayennepfeffer, Paprikapulver",
   zub:"1. Salat, Tomaten, Zwiebel, Avocado und Lauchzwiebeln schneiden. 2. Süßkartoffeln würfeln, mit Öl und Salz 20-30 Min bei 180°C backen. 3. Hack würzen, braten, Cheddar schmelzen. 4. Alles auf Teller anrichten."},
  {n:"Cheeseburger Fryerabend",em:"🍟",kcal:539,p:36,kh:55,f:18,port:"1 Portion",
   zut:"350g Kartoffeln · 100g Rinderhack fettreduziert · 30g Cheddar · 20g Gewürzgurken · 20g Ketchup light · 20g Mayo light · 5ml Olivenöl · Salz, Cayennepfeffer, Paprikapulver",
   zub:"1. Kartoffeln würfeln, in Airfryer mit Öl und Salz, Hack drauf, würzen. 2. 20 Min bei 200°C frittieren. 3. Ketchup und Mayo mischen. 4. Käse kurz vor Ende schmelzen lassen. 5. Gewürzgurken und Soße drüber."},
  {n:"Crispy Rice and Chicken",em:"🍚",kcal:740,p:48,kh:105,f:14,port:"1 Portion",
   zut:"300g gekochter Reis · 150g Hähnchenbrust · 150g Gurke · 1 Lauchzwiebel · 1 EL Sesamöl · 1 EL Sojasauce · 1 EL Sriracha-Sauce · 2 EL Teriyaki-Sauce · Curry, Knoblauchpulver",
   zub:"1. Reis mit Teriyaki, Sesamöl und Sriracha mischen, auf Backblech, 30 Min bei 180°C. 2. Hähnchen mit Sojasauce und Gewürzen 20 Min im Ofen. 3. Gurke und Lauchzwiebel schneiden. 4. Crispy Reis mit Gurken mischen. 5. Mit Hähnchen und Sojasauce servieren."},
  {n:"Snickers Protein Kuchen",em:"🍫",kcal:221,p:12,kh:30,f:4,port:"1 Stück (von 6)",
   zut:"½ Süßkartoffel · 2 Bananen · 50g Magerquark · 100g Haferflocken (gemahlen) · 50g Designer Whey Protein · 10g Backkakao · 1 Pack Backpulver · 1 EL Erdnussbutter · 30g Datteln · 10g Erdnüsse · 10g Schoko-Chunks",
   zub:"1. Süßkartoffel in Mikrowelle 8 Min bei 800W garen. 2. Süßkartoffel und Bananen zerdrücken. 3. Quark, Protein, Haferflocken, Kakao und Backpulver mixen. 4. Erste Schicht in Backform, Erdnussbutter, Datteln und Erdnüsse drauf. 5. Zweite Schicht Teig, mit Nüssen und Schoko-Chunks toppen. 6. 20-30 Min bei 170°C Umluft."},
  {n:"Topped Smashed Potatoes",em:"🥔",kcal:775,p:66,kh:49,f:27,port:"1 Portion",
   zut:"250g Kartoffeln (Drillinge) · 1 TL Öl · 2 Eier · 1 Lauchzwiebel · ½ Avocado · 3 Gewürzgurken · 250g Hüttenkäse light · Salz, Pfeffer",
   zub:"1. Drillinge 20 Min vorkochen, auf Backblech zerdrücken, mit Öl besprühen, salzen, 20 Min bei 200°C knusprig backen. 2. Eier kochen. 3. Eier, Lauchzwiebeln, Avocado und Gurken hacken, mit Hüttenkäse mischen, würzen. 4. Kartoffeln mit Dip servieren."},
  {n:"Carrot Cake Frühstück",em:"🥕",kcal:445,p:32,kh:58,f:7,port:"4 Portionen",
   zut:"200g Haferflocken · 1 Pack Backpulver · 2 Bananen · 50g Whey Protein · 350ml Mandelmilch · 1 Möhre · 5g Zimt · 20g Rosinen · 500g Skyr · 5g Designer Flavor Powder · 10g Walnüsse · 10ml Ahornsirup",
   zub:"1. Möhre reiben. 2. Bananen und Mandelmilch in Schüssel zerdrücken. 3. Haferflocken, Backpulver, Zimt, Rosinen und Whey dazugeben. 4. In Auflaufform, 20-30 Min bei 180°C. 5. Skyr mit Süßungsmittel süßen, drübergeben. 6. Mit Walnüssen und Ahornsirup toppen."},
  {n:"Merry Me Chicken Pasta",em:"🍝",kcal:599,p:40,kh:78,f:13,port:"4 Portionen",
   zut:"150g Cherrytomaten · 30g getrocknete Tomaten · 400g Hähnchenbrust · 400g Nudeln (ungekocht) · 150g Blattspinat · 250ml Kochsahne light · 1 EL Tomatenmark · 10g Parmesan · 2 Knoblauchzehen · Salz, Oregano, Chiliflocken",
   zub:"1. Nudeln kochen. 2. Tomaten halbieren und schneiden. 3. Hähnchen schneiden. 4. Tomatentöl erhitzen, Knoblauch, Chili und Oregano anbraten. 5. Hähnchen scharf anbraten. 6. Tomatenmark anschwitzen, mit Kochsahne ablöschen. 7. Tomaten und Spinat dazu, kurz aufkochen. 8. Nudeln einrühren, mit Parmesan toppen."},
  {n:"Flammkuchen Kartoffeln",em:"🥔",kcal:215,p:12,kh:31,f:4,port:"1 Kartoffel",
   zut:"4 große Kartoffeln · 2 Lauchzwiebeln · 2 EL Creme leicht · 50g Reibekäse light · 50g magere Schinkenwürfel · Salz, Pfeffer",
   zub:"1. Backkartoffeln 1 Stunde bei 200°C. 2. Deckel abschneiden, aushöhlen. 3. Inneres mit Creme leicht, Käse, Schinkenwürfeln und Lauchzwiebeln mischen, würzen. 4. Kartoffeln befüllen, mit Creme, Käse und Schinken toppen. 5. Nochmal 10-15 Min bei 200°C."},
  {n:"Hüttenkäse Banger",em:"🍅",kcal:679,p:52,kh:54,f:26,port:"1 Portion",
   zut:"150g Cherrytomaten · 125g Hirtenkäse light · 150g Hüttenkäse light · 300g Kartoffeln · 1 Knoblauchzehe · 1 TL Chiliöl · 1 TL Olivenöl · Petersilie · Salz, Oregano",
   zub:"1. Tomaten halbieren, Kartoffeln würfeln. 2. Tomaten in Auflaufform, Hirtenkäse drüber, Knoblauch pressen, mit Salz, Oregano und Chiliöl würzen. 3. Kartoffeln auf Backblech mit Öl und Salz. 4. Alles 20 Min bei 200°C backen. 5. Kartoffeln und Tomaten mit Hüttenkäse und Petersilie anrichten."},
  {n:"Bratkartoffel Gratin",em:"🥘",kcal:547,p:28,kh:59,f:20,port:"6 Portionen",
   zut:"2 kg Kartoffeln · 500ml Kochsahne 7 % · 1 Zwiebel · 150g Hähnchenbrust-Aufschnitt · 4 Eier · 200g Reibekäse light · 500g Brokkoli · Salz, Pfeffer, Maggi",
   zub:"1. Kartoffeln würfeln, 5 Min kochen. 2. Zwiebel anbraten, Kartoffeln dazu. 3. Aufschnitt schneiden, in Pfanne. 4. Eier, Kochsahne, Maggi verquirlen. 5. Bratkartoffeln, Brokkoli und Soße in Auflaufform, mit Käse belegen. 6. 30 Min bei 180°C Umluft."},
  {n:"Zur Strandfigur",em:"🥥",kcal:645,p:56,kh:65,f:18,port:"2 Portionen",
   zut:"600g Süßkartoffeln · 1 rote Zwiebel · 1 Brokkoli · 300g Hähnchenbrust · 1 TL Olivenöl · 3 EL Kokosmilch · 100ml Wasser · 2 EL Sojasauce · 5g Ingwer · 100g Gouda light · Salz, Pfeffer, Knoblauchgewürz, Currypulver",
   zub:"1. Süßkartoffeln schälen und schneiden, mit Zwiebel, Brokkoli und Hähnchen in Auflaufform. 2. Mit Öl, Salz und Gewürzen mengen. 3. 15 Min bei 180°C. 4. Soße aus Kokosmilch, Wasser, Sojasauce und Ingwer. 5. Soße drüber, mit Käse bestreuen, nochmal 10 Min backen."},
  {n:"Metaxa Fryerabend",em:"🫑",kcal:841,p:52,kh:112,f:14,port:"3 Portionen",
   zut:"3 bunte Paprika · 400g Hähnchen · 1 Zwiebel · 1 Knoblauchzehe · 2 EL Tomatenmark · 1 EL Gemüsebrühe · 2 Pinnchen Metaxa · 250ml Kochsahne light 7 % · 200ml Wasser · 100g Reibekäse light · 375g Reis (ungekocht) · Salz, Cayennepfeffer, Oregano, Paprikapulver",
   zub:"1. Zwiebel in Ringe schneiden, in Airfryer. 2. Paprika und Hähnchen in Streifen, dazu. 3. Knoblauch pressen, Öl und Gewürze dazu, 15 Min bei 180°C. 4. Reis kochen. 5. Kochsahne, Metaxa, Wasser, Brühe und Tomatenmark dazu, nochmal 10-15 Min. 6. Käse drüber, 5-10 Min fertig."},
  {n:"Asia Abnehm Bowl",em:"🥜",kcal:407,p:36,kh:46,f:8,port:"4 Portionen",
   zut:"Sauce: 2 EL Erdnussbutter · 2 EL Sojasauce · 1 EL Reisessig · 1 EL Ahornsirup · 1 EL Sriracha · 1 Knoblauchzehe · 5g Ingwer · 100ml Wasser | Salat: 1 Möhre · 200g Rotkohl · 150g Romana Salat · 400g Hähnchenbrust · 150g Couscous (ungekocht) · 10g Erdnüsse · 2 Lauchzwiebeln · Sojasauce, Curry",
   zub:"1. Couscous kochen. 2. Dressing aus allen Saucen-Zutaten pürieren. 3. Möhren reiben, Rotkohl und Salat in Streifen, Lauchzwiebeln schneiden, Erdnüsse hacken. 4. Mit Couscous und Dressing mischen. 5. Hähnchen würzen und braten. 6. Mit Hähnchen anrichten."},
  {n:"Kaiserschmarren",em:"🥞",kcal:694,p:51,kh:75,f:23,port:"1 Portion",
   zut:"2 TL Backpulver · 1-2 Scoops Designer Flavor Powder oder Honig · 10g Rosinen · 80g Dinkelmehl · 160g Skyr · 3 Eier · Erythrit",
   zub:"1. Eier trennen, Eiweiß steif schlagen. 2. Zum Eigelb: Skyr, Backpulver, Mehl und Süßungsmittel, mit Mixer verrühren. 3. Eischnee und Rosinen vorsichtig unterheben. 4. In Pfanne goldbraun braten, dann zerkleinern. 5. Mit Puderzucker aus Erythrit bestäuben."},
  {n:"Crispy Chicken Fryerabend",em:"🍗",kcal:707,p:46,kh:92,f:16,port:"1 Portion",
   zut:"300g Kartoffeln · 150g Hähnchenbrust · 100ml Hollandaise light · 1 TL Sambal Oelek · 1 TL Olivenöl · 50g Cornflakes · Salz, Paprikapulver",
   zub:"1. Kartoffeln und Hähnchen schneiden, mit Öl, Salz und Paprikapulver mengen. 2. Im Airfryer 20 Min bei 200°C. 3. Cornflakes zerkleinern, Hollandaise mit Sambal Oelek würzen. 4. Soße und Cornflakes in den Airfryer, gut mischen, 5-10 Min weiter."},
  {n:"Bienenstich",em:"🐝",kcal:582,p:42,kh:67,f:15,port:"3 Portionen",
   zut:"1 Banane · 60ml Ahornsirup · 150ml Mandelmilch · 150g griechischer Joghurt light · 1 Ei · 50g Designer Whey Protein · 150g Haferflocken (gemahlen) · 1 Pack Backpulver · 30g Mandelsplitter · 10g Honig · 2 Becher Proteinpudding Vanille",
   zub:"1. Ei, Banane, Ahornsirup, Joghurt und Mandelmilch mixen. 2. Haferflocken, Whey und Backpulver dazu. 3. Teig in Backform, 20 Min bei 180°C. 4. Mandeln mit Honig mischen, auf Backblech, 10 Min backen. 5. Kuchen halbieren, mit Proteinpudding füllen und Mandeln toppen."},
  {n:"One Pot Feta Pulled Chicken",em:"🧀",kcal:940,p:70,kh:131,f:13,port:"3 Portionen",
   zut:"400g Hähnchen · 200g Feta light · 2 EL Ajvar · 1 TL Olivenöl · 1 Knoblauchzehe · 1 rote Zwiebel · 1 gelbe Paprika · 500g Cherrytomaten · 1 TL Honig · 500g Nudeln (ungekocht) · Oregano, Salz",
   zub:"1. Feta in Mitte der Auflaufform, Hähnchen drum herum, salzen. 2. Ajvar, Öl, Knoblauch und Oregano verrühren, Hähnchen einpinseln. 3. Tomaten, Paprika und Zwiebeln dazu. 4. 45 Min bei 180°C backen. 5. Nudeln kochen. 6. Hähnchen mit Gabel zupfen, mit Nudeln mengen."},
  {n:"Leichte Waffeln",em:"🧇",kcal:533,p:38,kh:55,f:17,port:"1 Portion",
   zut:"100g Magerquark · 66g Mehl · 8g Backpulver · 30g Erythrit · 4 Eier",
   zub:"1. Alle Zutaten in einem Mixbecher mixen. 2. Den Teig im Waffeleisen backen."},
  {n:"Big Mac Tacos",em:"🌮",kcal:265,p:29,kh:16,f:9,port:"3 Portionen",
   zut:"300g Rinderhack fettreduziert · 3 Protein-Wraps · 100g Eisbergsalat · 50g Gewürzgurken · ½ rote Zwiebel · 1 EL Senf · 2 EL Mayo light · 2 EL Curry Ketchup light · 2 EL Gurkenwasser · Paprikapulver, Salz, Pfeffer, Knoblauchpulver",
   zub:"1. Hackfleisch würzen, auf Wrap auslegen. 2. Mit Hackfleischseite in Pfanne oder Grill braten. 3. Soße aus Senf, Mayo, Ketchup und Gurkenwasser rühren. 4. Salat, Gurken und Zwiebeln schneiden. 5. Wrap mit Salat und Soße belegen."},
  {n:"Frühstücks Tacos",em:"🥑",kcal:236,p:19,kh:3,f:15,port:"2 Wraps",
   zut:"3 Eier · 100g körniger Frischkäse light · 20g Cheddar · 50g Avocado · 50g Tomate · Petersilie · Salz, Pfeffer",
   zub:"1. 1 Ei, Frischkäse, Cheddar und Salz verrühren, auf Backblech, 10-15 Min bei 200°C – das ist der Wrap. 2. Restliche Eier zu Rührei braten. 3. Avocado zerdrücken, Tomaten schneiden. 4. Wrap mit Avocado, Tomaten, Rührei und Petersilie belegen."},
  {n:"Zupfkuchen",em:"🍰",kcal:1216,p:89,kh:129,f:33,port:"1 Kuchen (Gesamtkalorien)",
   zut:"350g Skyr · 150g Banane · 1 Ei · 100g Haferflocken · 3 TL Puddingpulver · 10g Backkakao · 25g Whey Protein · 25g Erdnussbutter · 175ml Mandelmilch · 2 Pack Backpulver · 5g Designer Flavor Powder",
   zub:"1. Helle Masse: Skyr, Backpulver, Ei, Puddingpulver und Süßungsmittel mixen. 2. Dunkle Masse: Banane zerdrücken, Haferflocken, Kakao, Whey, Mandelmilch, Erdnussbutter und Backpulver mixen. 3. Dunkle Masse in Backform füllen (etwas zurückhalten). 4. Helle Masse drauf, Kleckse der dunklen Masse drauf. 5. 30 Min bei 180°C."},
  {n:"Smashed Parmesan Chicken",em:"🧀",kcal:742,p:58,kh:52,f:33,port:"2 Portionen",
   zut:"300g Hähnchenbrust · 500g Kartoffeln · 1 Knoblauchzehe · 75g Parmesan · 500ml Kochsahne 7 % · 1 Zwiebel · 1 TL Olivenöl · Salz, Pfeffer, Paprikapulver",
   zub:"1. Kartoffeln kochen, auf Backblech zerdrücken, mit Öl und Salz, 20 Min bei 200°C. 2. Hähnchen schneiden und braten, würzen. 3. Zwiebel und Knoblauch dazu. 4. Mit Kochsahne ablöschen, Parmesan schmelzen. 5. Parmesan Chicken mit Smashed Potatoes anrichten."},
  {n:"Beast Fries",em:"🍟",kcal:617,p:47,kh:57,f:20,port:"1 Portion",
   zut:"300g Kartoffeln · 3 Scheiben Bacon · 30g Reibekäse light · 20g Cheddar · 200g Skyr · 2 EL Mayo light · 1 EL Kräuterfrischkäse light · 1 EL Essig · Salz, Knoblauchgewürz, Paprikapulver",
   zub:"1. Kartoffeln würfeln, auf Backblech, mit Salz und Paprikapulver. 2. Bacon klein schneiden, auf Kartoffeln legen. 3. Käse drüber. 4. 20 Min bei 200°C Umluft backen. 5. Dip aus Skyr, Mayo, Frischkäse, Essig und Knoblauchgewürz. 6. Kartoffeln mit Dip anrichten."},
  {n:"Crispy Rice Salat",em:"🥗",kcal:579,p:35,kh:85,f:9,port:"2 Portionen",
   zut:"200g Reis (ungekocht) · 200g Hähnchenbrust · 6 Minigurken · 3 EL Sojasauce · 1 TL Honig · 5g Sesam · 2 TL Sesamöl · 1 EL Reisessig · 1 Knoblauchzehe · 5g Ingwer · 2 Lauchzwiebeln · 5g Erdnüsse · Salz, Curry",
   zub:"1. Reis kochen, auf Backblech auslegen, mit Sojasauce, Curry und Öl mengen, 20 Min bei 200°C. 2. Gurken und Lauchzwiebeln schneiden. 3. Dressing aus Knoblauch, Ingwer, Sesamöl, Essig, Sojasauce, Honig und Sesam. 4. Hähnchen braten mit Curry und Soja. 5. Crispy Reis mit Gurken und Dressing mischen, mit Hähnchen und Erdnüssen anrichten."},
  {n:"Scrambled Oats",em:"🫐",kcal:525,p:23,kh:77,f:10,port:"1 Portion",
   zut:"40g Haferflocken · 2 TL Honig · 1 Banane · 1 Ei · 150g Joghurt 0,1 % · 50g Blaubeeren · 50g Himbeeren · Zimt",
   zub:"1. Banane zerdrücken, Haferflocken, Honig, Zimt und Ei hinzugeben. 2. Masse in Pfanne anbraten. 3. Mit Joghurt, Honig und Beeren servieren."},
  {n:"French Dressing",em:"🥗",kcal:46,p:4,kh:6,f:0,port:"1 Portion",
   zut:"4 EL Joghurt 0,1 % · 1 EL Essig · 1 TL Senf · 1 Prise Erythrit · 1 Prise Salz · 1 Knoblauchzehe",
   zub:"1. Joghurt, Essig, Senf, Erythrit, Salz und gepressten Knoblauch mixen."},
  {n:"Big Tasty Bacon Torte",em:"🥧",kcal:684,p:43,kh:63,f:28,port:"1 Kuchen / 4-6 Port.",
   zut:"1,5 kg Kartoffeln · 400g Rinderhack fettreduziert · 150g Cheddar · 500ml Kochsahne light · 50g Bacon · 1 Fleischtomate · 1 Zwiebel · 100g Eisbergsalat · 4 EL BBQ-Sauce light · Salz, Pfeffer, geräuchertes Paprikapulver",
   zub:"1. Kartoffeln kochen, in Kuchenform zerdrücken, salzen, mit Käse belegen. 2. Bacon knusprig braten. 3. Zwiebeln, Tomaten und Salat schneiden. 4. Kochsahne, Käse, BBQ-Sauce, Zwiebeln, Bacon und Gewürze kurz aufkochen. 5. Hackfleisch würzen und braten. 6. Hackfleisch auf Kartoffeln, Soße drüber, restlichen Käse. 7. 20 Min bei 200°C."},
  {n:"Lasagne Pommes",em:"🍟",kcal:790,p:62,kh:63,f:31,port:"2 Portionen",
   zut:"400g Rinderhack fettreduziert · 500g Kartoffeln · 50g Parmesan · 2 Knoblauchzehen · 1 Zwiebel · 1 Dose stückige Tomaten · 100g Tomatenmark · 100g Béchamelsauce · Oregano, Basilikum, Salz, Pfeffer",

async function load(){

    let c=await window.storage.get("90tc-c");if(c)state.config=JSON.parse(c.value);
    let l=await window.storage.get("90tc-l");if(l)state.logs=JSON.parse(l.value);
    let w=await window.storage.get("90tc-w");if(w)state.workouts=JSON.parse(w.value);
    let m=await window.storage.get("90tc-m");if(m)state.meals=JSON.parse(m.value);
    let ms=await window.storage.get("90tc-ms");if(ms)state.measures=JSON.parse(ms.value);
  }catch(e){}
  render();
}

// ═══════════════ HELPERS ═══════════════
function pD(s){let[y,m,d]=s.split("-");return new Date(y,m-1,d);}
function fmt(d){return d.toISOString().slice(0,10);}
function fmtD(s){let d=pD(s);return DS[d.getDay()]+", "+d.getDate()+"."+(d.getMonth()+1)+".";}
function chDate(n){let d=pD(state.date);d.setDate(d.getDate()+n);state.date=fmt(d);render();}
function getLog(){return state.logs[state.date]||{weight:0,kcal:0,protein:0,fat:0,carbs:0,sleep:0,steps:0,water:0,trained:false,progression:false,good1:"",good2:"",good3:"",supWhey:false,supCreatin:false,supVitamin:false,supOmega:false};}
function setLog(k,v){let l=getLog();l[k]=v;state.logs[state.date]=l;saveLogs();render();}
function getMeal(dt,sl){let id=state.meals[dt+"-"+sl];if(!id)return null;return R[sl].find(r=>r.id===id)||null;}
function getStreak(){
  if(!state.config)return 0;let streak=0;let d=new Date();
  for(let i=0;i<90;i++){let dt=fmt(d);let l=state.logs[dt];if(!l)break;
    let ct={...TGT};let wi2=getWIforDate(dt);if(wi2>8){ct.kcal=2115;}else if(wi2>4){ct.kcal=2230;}
    let ok=l.kcal>=ct.kcal*.9&&l.kcal<=ct.kcal*1.1&&l.protein>=200*.9&&l.steps>=9000&&l.sleep>=7&&l.water>=3.2;
    if(ok)streak++;else break;d.setDate(d.getDate()-1);}return streak;
}
function getWIforDate(dt){if(!state.config)return 1;let diff=Math.floor((pD(dt)-pD(state.config.sd))/864e5);return Math.min(12,Math.max(1,Math.ceil(Math.max(1,diff+1)/7)));}
function getDaysLeft(){if(!state.config)return 90;let diff=Math.floor((new Date()-pD(state.config.sd))/864e5);return Math.max(0,90-diff);}
function getBadges(){
  let b=[];let days=Object.keys(state.logs).length;let trains=Object.values(state.logs).filter(l=>l.trained).length;
  let weights=Object.entries(state.logs).filter(([_,l])=>l.weight>0).sort(([a],[b2])=>a.localeCompare(b2));
  let lost=weights.length>=2?weights[0][1].weight-weights[weights.length-1][1].weight:0;
  if(days>=1)b.push({em:"🎯",n:"Erster Tag",d:"Challenge gestartet!"});
  if(days>=7)b.push({em:"📅",n:"Erste Woche",d:"7 Tage geloggt"});
  if(days>=30)b.push({em:"🔥",n:"30 Tage",d:"Einen Monat durchgehalten!"});
  if(days>=60)b.push({em:"💎",n:"60 Tage",d:"Zwei Drittel geschafft!"});
  if(days>=90)b.push({em:"🏆",n:"90 TAGE!",d:"Challenge komplett!"});
  if(trains>=1)b.push({em:"💪",n:"Erstes Training",d:"Los geht's!"});
  if(trains>=10)b.push({em:"🏋️",n:"10 Trainings",d:"Routine aufgebaut"});
  if(trains>=25)b.push({em:"⚡",n:"25 Trainings",d:"Maschine!"});
  if(trains>=36)b.push({em:"👑",n:"Alle 36 Trainings",d:"Perfekte Disziplin!"});
  if(lost>=2)b.push({em:"📉",n:"-2 kg",d:"Erste Erfolge!"});
  if(lost>=5)b.push({em:"🎉",n:"-5 kg",d:"Halbzeit-Ziel!"});
  if(lost>=10)b.push({em:"🥇",n:"-10 kg",d:"ZIEL ERREICHT!"});
  if(getStreak()>=7)b.push({em:"🔥",n:"7-Tage-Streak",d:"Eine Woche perfekt!"});
  if(getStreak()>=30)b.push({em:"💫",n:"30-Tage-Streak",d:"Unaufhaltbar!"});
  return b;
}
function exDemo(name){return `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+' Übung Anleitung Band')}" target="_blank" rel="noopener" style="font-size:8px;color:#818cf8;text-decoration:none;margin-left:4px">📹 Demo</a>`;}
function setMeasure(week,field,val){if(!state.measures[week])state.measures[week]={};state.measures[week][field]=val;saveMeasures();render();}
function getWI(){
  if(!state.config)return{week:1,td:1,dl:false};
  let diff=Math.floor((pD(state.date)-pD(state.config.sd))/864e5);
  let td=Math.max(1,diff+1),w=Math.min(12,Math.max(1,Math.ceil(td/7)));
  return{week:w,td:td,dl:w===7};
}
function getCT(){let wi=getWI();let base=state.config&&state.config.targets?state.config.targets:{...TGT};let ct={...base};if(wi.week>8){ct.kcal=Math.round(base.kcal*0.9);ct.carbs=Math.round(base.carbs*0.85);}else if(wi.week>4){ct.kcal=Math.round(base.kcal*0.95);ct.carbs=Math.round(base.carbs*0.92);}return ct;}
function getWeekDates(){
  let d=pD(state.date),dow=d.getDay(),mon=new Date(d);
  mon.setDate(d.getDate()-((dow+6)%7));
  return Array.from({length:7},(_,i)=>{let x=new Date(mon);x.setDate(mon.getDate()+i);return fmt(x);});
}
function getShopList(dates){
  let items={};
  dates.forEach(dt=>{SLOTS.forEach(sl=>{let meal=getMeal(dt,sl.key);if(!meal)return;meal.items.forEach(it=>{let k=it[2]+"||"+it[1];if(!items[k])items[k]={name:it[2],unit:it[1],amt:0};items[k].amt+=it[0];});});});
  return Object.values(items).sort((a,b)=>a.name.localeCompare(b.name));
}
function categ(n){
  if(/Hähnchen|Puten|Rind|Hack|Lachs|Schinken|Frankfurter/.test(n))return"🥩 Fleisch & Fisch";
  if(/Quark|Skyr|Milch|Käse|Eier|Whey|Butter|Hüttenkäse|Feta|Joghurt|Kaffee/.test(n))return"🥛 Milch & Protein";
  if(/Reis|Nudel|Hafer|Brot|Wrap|Mehl|Müsli|Quinoa|Reiswaffeln|Brötchen|Grieß|Couscous|Semmel|Linsen|Chia|Back|Granola|Spätzle|Fleckerl|Rosinen|Knäckebrot|Löffelbiskuit|Datteln/.test(n))return"🌾 Getreide";
  if(/Brokkoli|Paprika|Zucchini|Tomat|Zwiebel|Bohnen|Spinat|Gurke|Möhren|Champignon|Salat|Erbsen|Mais|Gemüse|Kartoffel|Süßkartoffel|Knoblauch|Ofen|Kraut|Oliven|Sellerie|Kürbis|Avocado|Dill|Schnittlauch|Ingwer/.test(n))return"🥬 Gemüse";
  if(/Banane|Apfel|Beeren|Zitrone|Limette/.test(n))return"🍎 Obst";
  if(/Öl|Oliven|Honig|Soja|Erdnuss|Curry|Kräuter|Sesam|Kakao|Gyros|Zimt|Brühe|Vanille|Senf|Chili|Paprikapulver/.test(n))return"🧂 Gewürze";
  if(/Kidney|Kichererbsen|Kokosmilch|Weiße Bohnen/.test(n))return"🥫 Konserven";
  if(/Mandeln|Walnüsse|Kokosraspeln/.test(n))return"🥜 Nüsse";
  return"📦 Sonstiges";
}
function ring(val,max,col){
  let pct=Math.min(val/max,1),c=pct>=1?"#22c55e":col;

  html+=`<div style="border:2px solid #333;border-radius:8px;padding:10px;margin-top:10px"><strong>Tages-Gesamt:</strong> ${tot.k} kcal · Eiweiß: ${tot.p}g · Fett: ${tot.f}g · KH: ${tot.c}g</div></div>`;

function printWeek(){
  let wd=getWeekDates();
  let html=`<div style="font-family:sans-serif;max-width:700px;margin:0 auto;padding:20px"><h1 style="font-size:20px;margin-bottom:16px">90 Tage Challenge — Wochenplan</h1>`;
  wd.forEach(dt=>{
    let dow=pD(dt).getDay();
    let dm=SLOTS.map(sl=>({label:sl.label,meal:getMeal(dt,sl.key)})).filter(d=>d.meal);
    if(!dm.length)return;
    let tot=dm.reduce((a,d)=>({k:a.k+d.meal.k,p:a.p+d.meal.p,f:a.f+d.meal.f,c:a.c+d.meal.c}),{k:0,p:0,f:0,c:0});
    html+=`<div style="break-inside:avoid;margin-bottom:16px"><h2 style="font-size:15px;border-bottom:2px solid #333;padding-bottom:4px;margin-bottom:8px">${DS[dow]} ${pD(dt).getDate()}.${pD(dt).getMonth()+1}. — ${tot.k} kcal · P:${tot.p}g · F:${tot.f}g · KH:${tot.c}g</h2>`;
    dm.forEach(d=>{let m=d.meal;html+=`<div style="border:1px solid #ddd;border-radius:6px;padding:8px;margin-bottom:6px"><strong>${m.em} ${d.label}: ${m.n}</strong> <span style="color:#666;font-size:11px">(${m.k}kcal · E:${m.p}g · F:${m.f}g · KH:${m.c}g)</span><br><span style="font-size:11px">📝 ${m.items.map(i=>i[0]+i[1]+" "+i[2]).join(", ")}</span><br><span style="font-size:11px;color:#555">👨‍🍳 ${m.prep}</span></div>`;});
    html+=`</div>`;
  });
  let shop=getShopList(wd);
  if(shop.length){
    html+=`<div style="break-before:page"><h2 style="font-size:16px;margin-bottom:8px">🛒 Einkaufsliste</h2>`;
    let cats={};shop.forEach(it=>{let c=categ(it.name);if(!cats[c])cats[c]=[];cats[c].push(it);});
    Object.entries(cats).sort().forEach(([cat,items])=>{html+=`<h3 style="font-size:13px;color:#666;margin:8px 0 4px">${cat}</h3>`;items.forEach(it=>{html+=`<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #eee;font-size:12px"><span>${it.name}</span><strong>${Math.round(it.amt*10)/10}${it.unit?" "+it.unit:""}</strong></div>`;});});
    html+=`</div>`;
  }
  html+=`</div>`;
  document.getElementById('printArea').innerHTML=html;window.print();
}

function updWoField(field,val){

  wo[field]=val;state.workouts[wk]=wo;saveWo();render();
}
function updExField(idx,field,val){
  let wi=getWI(),plan=PD[state.selDay],wk="w"+wi.week+"d"+state.selDay;
  let wo=state.workouts[wk]||{exercises:plan.mov.map(m=>({m:m,n:(EX[m]||[m])[0],s:[],band:""}))};

function togWarmup(i){
  let wi=getWI(),wk="w"+wi.week+"d"+state.selDay;

function updEx(idx,val){

function updateSettings(){
  let h=+document.getElementById('sH').value||175;
  let w=+document.getElementById('sW').value||90;
  let age=+document.getElementById('sAge').value||44;
  let act=document.getElementById('sAct').value||"buero3";
  let name=document.getElementById('sName').value||"";
  let eq={};
  ["band","kh","kb","mb","pullup","bike","ball","matte","straps"].forEach(function(id){
    let el=document.getElementById('seq_'+id);eq[id]=el&&el.dataset.v==="1";
  });
  let bmr=Math.round(10*w+6.25*h-5*age+5);
  let factors={"buero3":1.55,"buero5":1.65,"aktiv3":1.7,"aktiv5":1.8};
  let tdee=Math.round(bmr*(factors[act]||1.55));
  let deficit=Math.round(tdee*0.85);
  let protein=Math.round(w*2.2);
  let fat=Math.round(deficit*0.2/9);
  let carbs=Math.round((deficit-protein*4-fat*9)/4);
  state.config.name=name;state.config.height=h;state.config.weight=w;state.config.age=age;
  state.config.activity=act;state.config.equipment=eq;
  state.config.targets={kcal:deficit,protein:protein,fat:fat,carbs:carbs};
  saveConfig();render();
}

async function exportData(){
  let data={config:state.config,logs:state.logs,workouts:state.workouts,meals:state.meals,measures:state.measures,version:3,exported:new Date().toISOString()};
  let json=JSON.stringify(data,null,2);
  let blob=new Blob([json],{type:'application/json'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a');
  a.href=url;a.download='90tc-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  let msg=document.getElementById('exportMsg');
  if(msg){msg.textContent='✅ Backup gespeichert!';msg.style.display='block';}
}

function importData(input){
  if(!input.files||!input.files[0])return;
  let reader=new FileReader();
  reader.onload=async function(e){
    try{
      let data=JSON.parse(e.target.result);
      if(data.config)state.config=data.config;
      if(data.logs)state.logs=data.logs;
      if(data.workouts)state.workouts=data.workouts;
      if(data.meals)state.meals=data.meals;
      if(data.measures)state.measures=data.measures;
      await saveConfig();await saveLogs();await saveWo();await saveMeals();await saveMeasures();
      let msg=document.getElementById('exportMsg');
      if(msg){msg.textContent='✅ '+Object.keys(state.logs).length+' Tage, '+Object.keys(state.meals).length+' Mahlzeiten importiert!';msg.style.display='block';msg.style.color='#6ee7b7';}
      render();
    }catch(err){
      let msg=document.getElementById('exportMsg');
      if(msg){msg.textContent='❌ Fehler beim Import: '+err.message;msg.style.display='block';msg.style.color='#f43f5e';}
    }
  };
  reader.readAsText(input.files[0]);
  input.value='';
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;showInstallBanner();});
function showInstallBanner(){
  if(document.getElementById('installBanner'))return;
  let b=document.createElement('div');b.id='installBanner';
  b.style.cssText='position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#6366f1,#4f46e5);padding:12px 14px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:8px;';
  b.innerHTML='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:white">📱 Als App installieren</div><div style="font-size:10px;color:#c7d2fe">Schnellzugriff vom Homescreen</div></div><button onclick="installApp()" style="padding:8px 16px;background:white;border:none;border-radius:8px;color:#4f46e5;font-weight:700;font-size:12px;cursor:pointer">Installieren</button><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#c7d2fe;font-size:18px;cursor:pointer;padding:4px">×</button>';
  document.body.prepend(b);
}
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;let b=document.getElementById('installBanner');if(b)b.remove();});}
}
// Service Worker für Offline
if('serviceWorker' in navigator){
  let swCode='self.addEventListener("install",function(e){self.skipWaiting();});self.addEventListener("activate",function(e){e.waitUntil(clients.claim());});self.addEventListener("fetch",function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request).then(function(res){return caches.open("90tc-v1").then(function(cache){cache.put(e.request,res.clone());return res;});}).catch(function(){return new Response("Offline");});}));});';
  let swBlob=new Blob([swCode],{type:'application/javascript'});
  let swUrl=URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(function(){});
}

load();
